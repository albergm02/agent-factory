name: main-integrity

# Compensating control: detects commits that reached main without going through
# a merged PR with green checks (security-model §12).
# For every commit pushed to main it verifies (1) the commit is the merge commit
# of a PR merged into main, and (2) that PR's head commit has green checks:
# `docs-check` and `secret-scan` must be present, completed with success. Any
# other check run is a violation only if it is completed with failure,
# cancelled, timed_out, action_required, startup_failure or stale. Runs still
# queued/in_progress/waiting/pending, or completed with success/neutral/skipped,
# are not violations (logged as ::notice::). Check runs named `verify` (this
# workflow's own job) are ignored. Otherwise it opens an [Alert] Discussion and
# fails the job.
#
# Edge cases:
# - Designed for SQUASH merges (the protect-main ruleset allows squash only).
#   For a squash merge, merge_commit_sha is the single commit on main. True
#   merge commits would push the PR's own commits too, which would be flagged;
#   rebase merges likewise (merge_commit_sha is only the rebased tip).
# - github.event.commits is capped at 20 commits, so the head commit
#   (github.sha) is always checked in addition, deduplicated.
# - Force pushes/new branches are not covered (this runs only on pushes to main).
# - The commits/<sha>/pulls API can lag shortly after a merge; the check retries.
# - The alert uses the Discussion category slug `decisions`, falling back to
#   `general`. If Discussions are disabled or creation fails, the job still
#   fails with an ::error:: message containing the details.
# - The gitleaks version pinned in ci.yml is not tracked by Dependabot; it is
#   updated manually (see the comment there).

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  discussions: write

concurrency:
  group: main-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PUSHER: ${{ github.event.pusher.name }}
      EVENT_COMMITS: ${{ toJSON(github.event.commits.*.id) }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Verify commits come from merged PRs
        run: |
          set -uo pipefail
          shas=$(printf '%s' "$EVENT_COMMITS" | python3 -c 'import json,sys; print(chr(10).join(json.load(sys.stdin) or []))' 2>/dev/null || true)
          shas=$(printf '%s\n%s\n' "$shas" "$HEAD_SHA" | awk 'NF && !seen[$0]++')

          bad=""
          reasons=""
          for sha in $shas; do
            pr=""
            apierr=""
            for attempt in 1 2 3; do
              out=$(gh api "repos/$REPO/commits/$sha/pulls" \
                --jq "[.[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$sha\")] | first | .head.sha // empty" 2>&1) \
                && { pr="$out"; apierr=""; } || { pr=""; apierr="$out"; }
              [ -n "$pr" ] && break
              sleep 5
            done
            [ -z "$pr" ] && [ -n "$apierr" ] && echo "::warning::API error looking up PRs for $sha: $apierr"
            if [ -z "$pr" ]; then
              echo "::error::Commit $sha is not the merge commit of a PR merged into main"
              bad="$bad $sha"
              reasons="$reasons | $sha: not the merge commit of a merged PR"
              continue
            fi

            # Green checks on the PR head commit ("verify" is this workflow's own job).
            failing=""
            runs=$(gh api --paginate "repos/$REPO/commits/$pr/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != "verify") | [.name, .status, (.conclusion // "")] | @tsv' 2>&1) \
              || { failing="API error: $runs"; runs=""; }
            missing=""
            for req in docs-check secret-scan; do
              printf '%s\n' "$runs" | awk -F'\t' -v n="$req" '$1==n && $2=="completed" && $3=="success"{f=1} END{exit !f}' || missing="$missing $req"
            done
            while IFS=$'\t' read -r rname rstatus rconc; do
              [ -n "$rname" ] || continue
              case "$rstatus:$rconc" in
                completed:failure|completed:cancelled|completed:timed_out|completed:action_required|completed:startup_failure|completed:stale)
                  failing="$failing $rname=$rconc" ;;
                completed:*) ;;
                *) echo "::notice::Check run '$rname' on PR head $pr is $rstatus (not treated as a violation)" ;;
              esac
            done <<< "$runs"
            if [ -n "$failing" ] || [ -n "$missing" ]; then
              echo "::error::PR head $pr of commit $sha lacks green checks (not green: ${failing:-none}; missing required:${missing:- none})"
              bad="$bad $sha"
              reasons="$reasons | $sha: PR head $pr checks not green (not green: ${failing:-none}; missing required:${missing:- none})"
            else
              echo "OK $sha (PR head $pr, checks green)"
            fi
          done

          [ -z "$bad" ] && exit 0

          owner="${REPO%%/*}"; name="${REPO##*/}"
          repo_id=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id}}' \
            -f o="$owner" -f n="$name" --jq .data.repository.id 2>&1) || repo_id=""
          cats=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){discussionCategories(first:50){nodes{id slug}}}}' \
            -f o="$owner" -f n="$name" --jq '.data.repository.discussionCategories.nodes[] | "\(.slug) \(.id)"' 2>&1) || cats=""
          cat_id=$(printf '%s\n' "$cats" | awk '$1=="decisions"{print $2}')
          [ -n "$cat_id" ] || cat_id=$(printf '%s\n' "$cats" | awk '$1=="general"{print $2}')
          if [ -z "$repo_id" ] || [ -z "$cat_id" ]; then
            echo "::error::Integrity violation(s) detected but no alert could be created (Discussions disabled or no 'decisions'/'general' category). Violations: $reasons"
            exit 1
          fi

          for sha in $bad; do
            short=${sha:0:7}
            body=$(printf '🤖 Agent Factory: commit %s reached `main` without a merged pull request with green checks.\n\n- Commit: https://github.com/%s/commit/%s\n- Pusher: %s\n- Workflow run: https://github.com/%s/actions/runs/%s\n\nRemediation: find out how the commit reached `main` (direct push, bypassed merge or red checks). If it is legitimate, document it here; otherwise revert it through a PR and review the guard hooks and permissions that should have prevented it.\n\nDetected violations: %s\n' \
              "$short" "$REPO" "$sha" "$PUSHER" "$REPO" "$GITHUB_RUN_ID" "$reasons")
            gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
              -f r="$repo_id" -f c="$cat_id" -f t="[Alert] Commit $short reached main without a merged PR with green checks" -f b="$body" \
              --jq .data.createDiscussion.discussion.url || echo "::error::Failed to create Discussion for $short. Violations: $reasons"
          done
          exit 1
